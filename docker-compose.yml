services:
  api:
    build:
      context: ./backend
      target: api
    env_file: .env
    # Compose-network hostname; overrides the localhost value in .env so one .env serves compose and direct runs.
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8200:8000"   # free VM port; tunnel-only bind
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      target: scheduler
    env_file: .env
    # Compose-network hostnames; override the localhost values in .env so one .env serves compose and direct runs.
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  # dashboard / mobile-web: added later as siblings
