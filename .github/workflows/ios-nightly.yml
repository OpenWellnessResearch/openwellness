name: iOS nightly

# iOS simulator tests are slow and macOS-only: nightly or manual, never per PR.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator tests
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: iOS simulator tests and framework link
        run: ./gradlew :feature:auth:domain:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
